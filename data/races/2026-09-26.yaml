        bracket: 2
        name: ホースB
        jockey: 武豊
        sex: 牡
        age: 5 # 出馬表の性齢をそのまま。生年は 2026 - 5 = 2021 として扱う
      - horseNumber: 5
        bracket: 3
        name: ホースA
        jockey: ルメール
        sex: 牡
        birthYear: 2022 # age の代わりに生年を直接書いてもよい
