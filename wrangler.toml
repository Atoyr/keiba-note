#:schema ./node_modules/wrangler/config-schema.json
# アプリ名は uma-memo だが、Worker と D1 の名前は旧名の k-note のまま。
# 変えると別の Worker・別の D1 になる（docs/operations.md「名前について」）。
name = "k-note"
# adapter-cloudflare が作る Worker（.svelte-kit/cloudflare/_worker.js）を包んだ入口。
# adapter の書き出し先は wrangler.adapter.toml にある（src/worker.js の頭を参照）。
main = "src/worker.js"

# 初期化時の日付で固定する。上げるときは意図的に上げること。
compatibility_date = "2026-09-20"
# nodejs_compat は付けない（起動コストとバンドルが増える）。
# nodejs_als は SvelteKit の adapter-cloudflare が AsyncLocalStorage を使うために必要な別物。
compatibility_flags = ["nodejs_als"]

# workers.dev は独自ドメインへの移行を確かめ終えるまで残す。
workers_dev = true
preview_urls = true

# 独自ドメイン。ゾーン uma-memo.com が同じ Cloudflare アカウントにある前提。
# デプロイ時に DNS レコードと証明書を Cloudflare が作る。
routes = [{ pattern = "uma-memo.com", custom_domain = true }]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[observability]
enabled = true
# Workers Logs が自動で残す呼び出しログから、URL のクエリ文字列を落とす。
# /auth/google/callback の ?code=&state=（OAuth の認可コード）と /horses の ?q=（検索語）が
# そのまま残るため（docs/monitoring.md 第2章「出さないもの」）。
redact_query_string = true

# Workers Paid の既定（CPU 30秒・サブリクエスト 10,000）は、暴走したときに止まらず課金が進む。
# 暴走は止め、普段の処理は決して当たらない高さに置く。**上限に当たっても Discord には届かない**
# （同じ呼び出しからの通知も止まる）ので、普段の処理が当たる低さに置くと、利用者だけがエラーを見て
# 誰も気づけない（docs/monitoring.md 9-1）。Preview（ステージング）にも同じ値が効く。
[limits]
# 1呼び出しの CPU 時間（ms）。SSR は数ms で、Free の 10ms で動いていた。その100倍。
cpu_ms = 1000
# 1呼び出しの fetch などの数。D1 クエリの約束は10以内（architecture.md 7-1）だが、それは上限で縛らない。
subrequests = 1000

# src/worker.js から import する TS（Cron の入口）は SvelteKit ではなく wrangler が束ねる。
# そこで使う `$lib` を SvelteKit と同じ場所に向ける。
[alias]
"$lib" = "./src/lib"

# オッズの更新（src/lib/server/odds/scheduled.ts）。UTC で書く。JST 7:00〜25:00（翌 1:00）の30分おき。
#   "*/30 22-23,0-15 * * *" … JST 7:00〜24:30
#   "0 16 * * *"            … JST 25:00 ちょうどの1回（上の式では拾えない）
# ネットの前日発売は夜間も売っているので 25:00 まで回す。25:00〜7:00 は回さない。
# 重賞は前日（G1 は前々日）の 18:30 から取りに行く。
# 取りに行くのは時間帯に入ったレース（src/lib/utils/odds.ts の inOddsWindow）がある回だけで、
# 無い回は D1 を1回読んで終わる。
#
# 出走馬の取得の依頼（src/lib/server/race-data/scheduled.ts の ENTRIES_CRON と同じ文字列にする）。
# 1-10 時 = JST 10:05〜19:05 の毎時。枠順を待っている重賞（1〜3日後で馬番が未入力）があれば、
# GitHub Actions（race-data-fetch.yml）に出馬表を取らせて YAML の PR を作らせる。netkeiba へは Worker から行かない。
#
# Workers Previews（ステージング）では Cron は動かない。
[triggers]
crons = ["*/30 22-23,0-15 * * *", "0 16 * * *", "5 1-10 * * *"]

# 通知（Discord）に出す環境の名前（docs/monitoring.md）。シークレットではない。
# ローカルは hooks.server.ts が `dev` を見て local にする。
[vars]
APP_ENV = "production"

# 出走馬の取得を頼む GitHub のリポジトリ（src/lib/server/race-data/dispatch.ts）。シークレットではない。
# トークンは GITHUB_DISPATCH_TOKEN（wrangler secret。docs/operations.md）。
# [previews.vars] には置かない。ステージングから本番のデータの PR を作らせない（管理画面のボタンも押せなくなる）。
GITHUB_REPOSITORY = "Atoyr/keiba-note"

# Workers Previews は本番の vars を継承しない。
[previews.vars]
APP_ENV = "staging"

[[d1_databases]]
binding = "DB"
database_name = "k-note"
database_id = "ff841b63-5859-48de-b868-17c1df1144d0"
migrations_dir = "drizzle"

# Workers Previews は本番のバインディングを継承しない。
# すべての Preview は既定で共通のステージング D1 を使う。
[[previews.d1_databases]]
binding = "DB"
database_name = "k-note-staging"
database_id = "cb00f7c8-a0ed-4531-a39d-cde76b0d90bd"
migrations_dir = "drizzle"
