name: デプロイ

# リリースを publish したときだけ本番に出す。
# main への push では出さない（main は「次に出す候補」であって本番ではない）。
#
# workflow_dispatch は、リリース時に Cloudflare 側の都合で失敗したときの
# 手動リトライ用。実行するブランチ/タグを選んで流す。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # リリースのタグは main の CI を通った commit のはずだが、
  # 任意の commit からタグを切ることもできるので、出す前にもう一度回す。
  verify:
    name: 検証
    uses: ./.github/workflows/ci.yml

  deploy:
    name: デプロイ
    needs: [verify]
    runs-on: ubuntu-latest
    # デプロイだけは同時に走らせない。打ち切りもしない（途中で止めるほうが危ない）。
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # **順番が大事。** マイグレーション → デプロイ → データ投入。
      #
      # 逆（デプロイが先）だと、新しいコードが古いスキーマに当たって壊れる。
      # この順でも「古いコードが新しいスキーマに当たる」窓は数十秒開くので、
      # 列を消すような破壊的なマイグレーションを流すときは承知の上で行うこと。
      - name: 本番 D1 にマイグレーション
        run: pnpm run db:migrate:remote

      - name: デプロイ
        run: pnpm run deploy

      # レースデータの投入はここでは**やらない**（data-import.yml の担当）。
      #
      # ここは release のタグを checkout している。main には既に新しい
      # data/races/ が入っていることがあり、それを投入済みの D1 に対して
      # タグ時点の古い YAML を流すと、枠・馬番が古い状態に巻き戻る
      # （結果は COALESCE で残るが、枠順は YAML が正なので上書きされる）。
      #
      # マイグレーションで列が増えて入れ直したいときは、
      # data-import.yml を workflow_dispatch で流す。
