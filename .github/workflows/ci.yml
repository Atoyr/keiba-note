name: CI

on:
  push:
    branches: [main]
  pull_request:
  # デプロイ前の再検証として deploy.yml から呼ばれる。
  workflow_call:

# 同じブランチで新しい push があったら、走っている古い実行は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# checkout するだけなので読み取りで足りる。
permissions:
  contents: read

jobs:
  check:
    name: 検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # YAML の検証は D1 に触らないので、ここで落とすのが一番早い。
      - name: 出走馬データの検証
        run: pnpm run data:check

      - name: 型
        run: pnpm run check
      - name: 整形と lint
        run: pnpm run lint
      - name: 単体テスト
        run: pnpm run test:unit -- --run

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 共有ページ（/notes/[id]）のテストが DB を引くので、先にテーブルを作る。
      # ローカル D1 は .wrangler/state に作られる使い捨て。
      - name: ローカル D1 にマイグレーション
        run: pnpm run db:migrate:local

      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
