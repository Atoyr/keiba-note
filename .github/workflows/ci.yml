name: CI

on:
  push:
    branches: [main]
  pull_request:
  # デプロイ前の再検証として deploy.yml から呼ばれる。
  workflow_call:

# 同じブランチで新しい push があったら、走っている古い実行は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# checkout するだけなので読み取りで足りる。
permissions:
  contents: read

jobs:
  check:
    name: 検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # YAML の検証は D1 に触らないので、ここで落とすのが一番早い。
      - name: 出走馬データの検証
        run: pnpm run data:check

      - name: 型
        run: pnpm run check
      # lint には文書の目次とリンクの検査（docs:check）も入っている。
      - name: 整形・lint・文書
        run: pnpm run lint

      # 2つのジョブとも chromium だけを使うので、キャッシュは共用できる。
      # playwright のバージョンが上がれば lock の hash が変わって引き直される。
      - name: Playwright のブラウザをキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # 単体テストのうち client プロジェクト（*.svelte.spec.ts）は
      # vitest のブラウザモードで走るので chromium が要る。
      - name: chromium の取得
        run: pnpm exec playwright install chromium
      - name: 単体テスト
        run: pnpm run test:unit

  # data/ と文書だけの PR では E2E を飛ばす（docs/testing.md 第1章）。アプリも E2E も data/ と .md を読まない
  # （E2E の中身は e2e/seed.sql だけ）。data/ は検証ジョブの data:check、文書は lint の docs:check が見る。
  # 対象は data/・docs/・*.md だけ。.claude/ の設定（.json など）は E2E に関わりうるので飛ばさない。
  # アプリか E2E に data/ や .md を読ませるときは、下の条件も直す。
  # PR のマージコミットの HEAD^1（取り込み先の先端）と HEAD の差で見る。--no-renames は、src/ から docs/ への
  # 移動を「docs/ だけの変更」に見せないため（移動元も出す）。
  # PR 以外（main への push・workflow_call）と、差分が取れなかったときは回す側に倒す。
  changes:
    name: E2E の要否
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        run: |
          e2e=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if ! files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
              echo "差分が取れなかったので E2E を回す"
              echo "e2e=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "変更されたファイル:"
            printf '%s\n' "$files"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(data|docs)/|\.md$'; then
              e2e=false
              echo "data/ と文書だけの変更なので E2E を飛ばす"
            else
              echo "E2E を回す"
            fi
          else
            echo "PR ではないので E2E を回す"
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 検証ジョブと同じ key。先に走ったほうが温める。
      - name: Playwright のブラウザをキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # ブラウザの取得は test:e2e が内部でやる（playwright install chromium）。
      # E2E 専用の D1（.wrangler/e2e）のマイグレーションと seed は、playwright.config.ts の
      # webServer が wrangler dev を立てる前にやる（e2e/seed.ts）。
      - run: pnpm run test:e2e
      # 画面カタログ（e2e/screens.ts）の全画面。PR に貼り忘れても、ここから見られる。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: test-results/screens/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # main で落ちたときだけ Discord へ知らせる（docs/monitoring.md）。
  # PR の失敗は書いた人が画面で見ているので送らない（通知が埋もれる）。
  # deploy.yml から workflow_call で呼ばれたときは event_name が release になるので、
  # ここでは送らず deploy.yml の通知に任せる。
  notify:
    name: 失敗を通知
    needs: [check, changes, e2e]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/discord-notify.yml
    with:
      channel: deploy
      level: error
      title: main の CI が落ちた
      description: 型・lint・単体テスト・E2E のどれかが落ちています。リンクから実行を開いてください。
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
