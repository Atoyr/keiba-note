name: CI

on:
  push:
    branches: [main]
  pull_request:
  # デプロイ前の再検証として deploy.yml から呼ばれる。
  workflow_call:

# 同じブランチで新しい push があったら、走っている古い実行は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# checkout するだけなので読み取りで足りる。
permissions:
  contents: read

jobs:
  check:
    name: 検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # YAML の検証は D1 に触らないので、ここで落とすのが一番早い。
      - name: 出走馬データの検証
        run: pnpm run data:check

      - name: 型
        run: pnpm run check
      # lint には文書の目次とリンクの検査（docs:check）も入っている。
      - name: 整形・lint・文書
        run: pnpm run lint

      # 2つのジョブとも chromium だけを使うので、キャッシュは共用できる。
      # playwright のバージョンが上がれば lock の hash が変わって引き直される。
      - name: Playwright のブラウザをキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # 単体テストのうち client プロジェクト（*.svelte.spec.ts）は
      # vitest のブラウザモードで走るので chromium が要る。
      - name: chromium の取得
        run: pnpm exec playwright install chromium
      - name: 単体テスト
        run: pnpm run test:unit

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 検証ジョブと同じ key。先に走ったほうが温める。
      - name: Playwright のブラウザをキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # ブラウザの取得は test:e2e が内部でやる（playwright install chromium）。
      # E2E 専用の D1（.wrangler/e2e）のマイグレーションと seed は globalSetup がやる。
      - run: pnpm run test:e2e
      # 画面カタログ（e2e/screens.ts）の全画面。PR に貼り忘れても、ここから見られる。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: test-results/screens/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
