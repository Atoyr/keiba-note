name: 出走馬・結果の取得

# Worker から workflow_dispatch で起動される（src/lib/server/race-data/）。
#   cron  … 重賞の出馬表が決まる時刻に、段（stage）ごとに。日曜の候補・木曜の出走馬は出馬表をそのまま書く。
#           金曜の枠順（stage: frames）は require_confirmed: true で、確定するまでは何も書かない
#           開催日の夕方には、当日の出走馬がある JRA のレースの結果を command: result で（結果の Cron。時刻は wrangler.toml）
#   admin … 管理画面の「出走馬を取得」（候補でも枠順でも、その時点の出馬表を書く）
#   manual … Actions のタブから手で。command で何を取るかを選ぶ（entries = 出馬表 / result = 結果）。
#           結果の Cron が取れなかったとき（未発表・通信の失敗）の取り直しもここから
#
# netkeiba の出馬表を `data:fetch entries`、結果を `data:fetch result` で data/races/<開催日>.yaml に書き、差分があれば PR を作る。
# entries の回は、続けて出走馬の過去5走も `data:fetch past` で取り（各過去走の開催日のファイルに足す）、同じ PR に入れる。
# 過去走の取得が落ちても出馬表の PR は作り、Discord に知らせる（notify-past-failed）。枠順未確定で何も書かない回は past も流さない。
# PR のブランチは command ごとに分けるが、どちらも main の YAML の同じレースを書く。結果は出走馬・枠順の PR をマージしてから取る。
# **D1 には触らない。** 本番に入るのは、人がその PR をマージしたとき（data-import.yml）。
# 出走馬データの正は YAML のまま（docs/architecture.md 第0章）。
#
# 動かすには、リポジトリの Settings > Actions > General で
# 「Allow GitHub Actions to create and approve pull requests」を入れておく（docs/operations.md）。
# GITHUB_TOKEN で作った PR には ci.yml・pr-body.yml が走らない。検証（data:check）はここで済ませる。
on:
  workflow_dispatch:
    inputs:
      command:
        description: '何を取るか（entries = 候補・出走馬・枠順 / result = 結果）。出走馬の Cron と管理画面は送らないので entries。結果の Cron は result'
        type: choice
        options:
          - entries
          - result
        required: false
        default: entries
      date:
        description: '開催日（YYYY-MM-DD）'
        type: string
        required: true
      course:
        description: '競馬場（中山 など JRA の10場）'
        type: string
        required: true
      race_number:
        description: 'レース番号（1〜12）'
        type: string
        required: true
      race_id:
        description: 'netkeiba の race_id（12桁）。分かっていれば。無ければ当週のレース一覧から引く（result は空でよい。YAML のレースの ref を使う）'
        type: string
        required: false
        default: ''
      require_confirmed:
        description: '枠順が確定していなければ何も書かない'
        type: boolean
        required: false
        default: false
      stage:
        description: 'Cron の段（candidates / entries / frames）。PR 本文の「なぜ」に使う。Cron 以外は空'
        type: string
        required: false
        default: ''
      trigger:
        description: '起動元（cron / admin / manual）。PR 本文に書く'
        type: string
        required: false
        default: manual

permissions:
  contents: write
  pull-requests: write

# 同じレースの取得だけを1本ずつにする。全体を1つの群にすると、待っている回は最新の1つしか残らず、
# 同じ回に頼まれた別のレースが取り消される。
concurrency:
  group: race-data-fetch-${{ inputs.command || 'entries' }}-${{ inputs.date }}-${{ inputs.course }}-${{ inputs.race_number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  fetch:
    name: 取得
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pr_url: ${{ steps.pr.outputs.url }}
      unconfirmed: ${{ steps.fetch.outputs.unconfirmed }}
      past_failed: ${{ steps.check.outputs.past_failed || steps.fetch.outputs.past_failed }}
    # 入力は環境変数で渡す。run の中に ${{ }} で埋め込むと、値がシェルとして解釈されうる。
    env:
      COMMAND: ${{ inputs.command }}
      DATE: ${{ inputs.date }}
      COURSE: ${{ inputs.course }}
      RACE_NUMBER: ${{ inputs.race_number }}
      RACE_ID: ${{ inputs.race_id }}
      REQUIRE_CONFIRMED: ${{ inputs.require_confirmed }}
      STAGE: ${{ inputs.stage }}
      TRIGGER: ${{ inputs.trigger }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 入力を確かめる
        run: |
          # choice でも API からは任意の文字列が来うる。出走馬の Cron と管理画面は command を送らないので、空は entries の扱い
          COMMAND="${COMMAND:-entries}"
          [[ "$COMMAND" =~ ^(entries|result)$ ]] || { echo "::error::command が entries / result のどちらでもありません"; exit 1; }
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::date が YYYY-MM-DD ではありません"; exit 1; }
          [[ "$RACE_NUMBER" =~ ^([1-9]|1[0-2])$ ]] || { echo "::error::race_number が 1〜12 ではありません"; exit 1; }
          [[ -z "$RACE_ID" || "$RACE_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::race_id が12桁の数字ではありません"; exit 1; }
          [[ -z "$STAGE" || "$STAGE" =~ ^(candidates|entries|frames)$ ]] || { echo "::error::stage が candidates / entries / frames のどれでもありません"; exit 1; }
          if [ "$COMMAND" = "result" ]; then
            # 結果に、枠順の確定待ちや Cron の段は無い
            [ "$REQUIRE_CONFIRMED" != "true" ] || { echo "::error::command が result のとき require_confirmed は使えません"; exit 1; }
            [ -z "$STAGE" ] || { echo "::error::command が result のとき stage は使えません"; exit 1; }
          fi
          # course が JRA の10場かは data:fetch が見る

      # 結果は main の YAML に書く。同じレースの出走馬・枠順の PR が開いたままだと、候補のままの YAML に書き、
      # その PR と同じレースを書き換え合う。手で起動していたころは人が守っていた順番を、Cron でも守る
      - name: 出走馬・枠順の PR が開いていないか見る
        if: inputs.command == 'result'
        run: |
          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "data-fetch/${DATE}-${COURSE}${RACE_NUMBER}R" --state open             --json url,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0].url // ""')
          if [ -n "$url" ]; then
            echo "::error::出走馬・枠順の PR（$url）が開いています。マージしてから結果を取り直してください"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 騎手・調教師の名前（data:fetch が各人のページを引いて node_modules/.cache/race-data/ に覚える）を
      # 回をまたいで使う。無いと毎回30頭ぶん以上 netkeiba を引きに行く。
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/race-data
          key: race-data-people-${{ github.run_id }}
          restore-keys: race-data-people-

      - name: netkeiba から取る
        id: fetch
        run: |
          COMMAND="${COMMAND:-entries}"
          args=("$COMMAND" "$DATE" "$COURSE" "$RACE_NUMBER")
          if [ -n "$RACE_ID" ]; then args+=(--race-id "$RACE_ID"); fi
          if [ "$COMMAND" = "entries" ] && [ "$REQUIRE_CONFIRMED" = "true" ]; then args+=(--require-confirmed); fi
          pnpm run --silent data:fetch "${args[@]}" | tee "$RUNNER_TEMP/fetch.log"
          # 金曜の回は1日1回しか取らない。枠順が未確定で終わったら、黙らずに知らせる（notify-unconfirmed）
          not_written=false
          if grep -q "枠順未確定のため書きません" "$RUNNER_TEMP/fetch.log"; then not_written=true; fi
          if [ "$STAGE" = "frames" ] && [ "$not_written" = "true" ]; then
            echo "unconfirmed=true" >> "$GITHUB_OUTPUT"
          fi

          # 出走馬の過去5走。entries の回だけ、何か書いたときだけ流す（結果の回と、枠順未確定で何も書かない回は流さない）。
          # past は空いている項目だけ埋めるので、何度流しても同じ結果になる。落ちても出馬表の PR は作る（past_failed で知らせる）。
          # past は最後にまとめて保存するので、途中で落ちたら過去走のファイルは書かれない。
          if [ "$COMMAND" = "entries" ] && [ "$not_written" != "true" ]; then
            # fetchPage にタイムアウトが無く、netkeiba が応答しないと job の timeout で出馬表の PR ごと止まる。
            # 8分で打ち切る。pnpm を挟むと SIGTERM が子に届かず tee が待ち続けるので、node を直接呼ぶ（data:fetch の中身と同じ）
            # data:check が落ちたとき、出馬表の YAML だけに戻せるよう、entries が書いた直後の中身を覚えておく
            if [ -f "data/races/${DATE}.yaml" ]; then cp "data/races/${DATE}.yaml" "$RUNNER_TEMP/entries-file.yaml"; fi
            set +e
            timeout --kill-after=10s 8m node --experimental-strip-types scripts/race-data.ts past "$DATE" "$COURSE" "$RACE_NUMBER" 2>&1 | tee -a "$RUNNER_TEMP/fetch.log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "past_ran=true" >> "$GITHUB_OUTPUT"
            if [ "$rc" -ne 0 ]; then
              if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
                reason="過去走の取得が8分で終わらず打ち切った（終了コード ${rc}）"
              else
                reason="過去走の取得が落ちた（終了コード ${rc}）"
              fi
              echo "::warning::${reason}。出馬表だけで PR を作ります"
              echo "! ${reason}。過去走は書いていない" | tee -a "$RUNNER_TEMP/fetch.log"
              echo "past_failed=true" >> "$GITHUB_OUTPUT"
              echo "past_reason=${reason}" >> "$GITHUB_OUTPUT"
              # 打ち切りで途中まで書かれていても、出馬表だけにそろえる（past は最後に保存するので、ふつうは書かれていない）
              git status --porcelain -- data/races | while IFS= read -r line; do
                f="${line:3}"
                [ "$f" = "data/races/${DATE}.yaml" ] && continue
                if [ "${line:0:2}" = "??" ]; then rm -f -- "$f"; else git checkout -- "$f"; fi
              done
              if [ -f "$RUNNER_TEMP/entries-file.yaml" ]; then cp "$RUNNER_TEMP/entries-file.yaml" "data/races/${DATE}.yaml"; fi
            fi
          fi

      - name: 差分を見る
        id: diff
        run: |
          # 過去走は新しいファイルも作るので、未追跡も見る
          if [ -z "$(git status --porcelain -- data/races)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "main と同じ中身なので PR は作らない"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- data/races
          fi

      - name: 出走馬データの検証
        id: check
        if: steps.diff.outputs.changed == 'true'
        env:
          PAST_RAN: ${{ steps.fetch.outputs.past_ran }}
          PAST_FAILED: ${{ steps.fetch.outputs.past_failed }}
        run: |
          set +e
          pnpm run --silent data:check | tee "$RUNNER_TEMP/check.log"
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] && exit 0

          # 過去走が書いたファイルが原因かもしれない。過去走を外し、出馬表だけで通れば PR は作る（通らなければ今までどおり落とす）
          if [ "$PAST_RAN" != "true" ] || [ "$PAST_FAILED" = "true" ]; then exit "$rc"; fi
          echo "::warning::data:check が落ちたので、過去走を外して出馬表だけで検証し直します"
          cp "$RUNNER_TEMP/check.log" "$RUNNER_TEMP/check-with-past.log"
          git status --porcelain -- data/races | while IFS= read -r line; do
            f="${line:3}"
            [ "$f" = "data/races/${DATE}.yaml" ] && continue
            if [ "${line:0:2}" = "??" ]; then rm -f -- "$f"; else git checkout -- "$f"; fi
          done
          if [ -f "$RUNNER_TEMP/entries-file.yaml" ]; then cp "$RUNNER_TEMP/entries-file.yaml" "data/races/${DATE}.yaml"; fi
          pnpm run --silent data:check | tee "$RUNNER_TEMP/check.log"
          echo "past_failed=true" >> "$GITHUB_OUTPUT"
          echo "past_reason=過去走が data:check に落ちたので外した" >> "$GITHUB_OUTPUT"

      - name: PR を作る・更新する
        id: pr
        if: steps.diff.outputs.changed == 'true'
        env:
          PAST_FAILED: ${{ steps.check.outputs.past_failed || steps.fetch.outputs.past_failed }}
          PAST_REASON: ${{ steps.check.outputs.past_reason || steps.fetch.outputs.past_reason }}
        run: |
          COMMAND="${COMMAND:-entries}"
          # 出馬表と結果は別のブランチ・別の PR にする
          if [ "$COMMAND" = "result" ]; then
            branch="data-fetch/${DATE}-${COURSE}${RACE_NUMBER}R-result"
            subject="${DATE} ${COURSE}${RACE_NUMBER}R の結果"
          else
            branch="data-fetch/${DATE}-${COURSE}${RACE_NUMBER}R"
            subject="${DATE} ${COURSE}${RACE_NUMBER}R の出走馬"
          fi
          file="data/races/${DATE}.yaml"

          # 今回変えたファイル（過去走は各過去走の開催日のファイルを書く。新規も含む）
          git add -A -- data/races
          mapfile -t files < <(git diff --cached --name-only -- data/races)

          # 同じレースは段ごとに何度も取る（候補・出走馬・枠順）。開いている PR が同じ中身なら何もしない
          # （url を出さないので、通知も送らない）。比べるのは今回変えたファイルだけ（main が進むたびに作り直さないため）。
          # PR ブランチ側にだけあるファイルは見ない。ブランチだけを見ると、PR の作成で落ちた回に
          # push したブランチが残り、そのあとは PR が無いまま何もしなくなる。
          # --head はブランチ名だけで照らすので、同じ名前の fork からの PR も当たる。このリポジトリの PR だけを見る。
          url=$(gh pr list --head "$branch" --state open --json url,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].url // ""')
          if [ -n "$url" ] && git fetch --quiet origin "$branch" 2>/dev/null && git diff --cached --quiet FETCH_HEAD -- "${files[@]}"; then
            echo "開いている PR（$url）と同じ中身なので何もしない"
            exit 0
          fi

          if [ "$COMMAND" = "result" ] && [ "$TRIGGER" = "cron" ]; then
            why="開催日の夕方に、Cron が当日のレースの結果を取ったため。"
          elif [ "$COMMAND" = "result" ]; then
            why="${TRIGGER} から結果の取得を頼まれたため。"
          elif [ "$TRIGGER" = "cron" ]; then
            case "$STAGE" in
              candidates) why="日曜の候補の決定に合わせて Cron が出馬表（登録馬）を取ったため。" ;;
              entries) why="木曜の出走馬の発表に合わせて Cron が出馬表を取ったため（枠順が出ていれば枠・馬番まで入る）。" ;;
              frames) why="金曜の枠順の発表に合わせて Cron が出馬表を取り、枠順が確定していたため。" ;;
              *) why="Cron が重賞の出馬表を取ったため。" ;;
            esac
          else
            why="${TRIGGER} から取得を頼まれたため。"
          fi

          if [ "$COMMAND" = "result" ]; then
            what="netkeiba の結果を \`data:fetch result\` で書いた"
          else
            what="netkeiba の出馬表を \`data:fetch entries\` で書いた"
          fi

          {
            echo "## 何を変えたか"
            echo
            echo "- \`${file}\` の ${COURSE}${RACE_NUMBER}R に、${what}（起動元: ${TRIGGER}）"
            if [ "$COMMAND" != "result" ]; then
              if [ "$PAST_FAILED" = "true" ]; then
                echo "- **過去走の取得は落ちたので入っていない**（${PAST_REASON}。出馬表だけ。前の回にこの PR へ入っていた過去走も抜けている）。手で \`pnpm run data:fetch past\` を流すか、管理画面の「出走馬を取得」で取り直す"
              else
                echo "- 出走馬の過去5走を \`data:fetch past\` で、それぞれの開催日のファイルに足した"
              fi
            fi
            echo "- 変えたファイル:"
            git status --short -- data/races | sed 's/^/  - `/; s/$/`/' || true
            echo "- このブランチは Actions が作り直す。同じレースをもう一度取ると、main から作り直して上書きする（手で足したコミットは消える）"
            echo
            echo "**⚠️ マージすると \`data-import.yml\` が本番 D1 に投入する。**"
            echo
            echo "## レビューで見てほしいところ"
            echo
            if [ "$COMMAND" = "result" ]; then
              echo "- \`! …: 結果の表にいません\` は YAML（main）にいて結果に無い馬。候補のまま結果を取った可能性があるので、出走馬・枠順の PR を先にマージしたか確かめる"
              echo "- 着順が数字で入った頭数が出走頭数（\`fieldSize\`）と合っているか（YAML に全頭いるときだけ。気にしている馬だけ載せた条件戦では合わない）。取消・除外・中止はログに \`取消\` などと出て着順は入らない"
              echo "- 結果は上書きなので、以前に手で入れた値と netkeiba が食い違うとその行が差分に出る（正しい方は db.netkeiba.com のレースページで確かめる）"
              echo "- YAML にいない馬は足さない（ログに並ぶ）"
            else
              echo "- 下のログの \`- …（出馬表に無いので withdrawn へ）\` は取り下げた馬。投入すると出走馬行が消え、付いていたメモは近況メモへ移る"
              echo "- \`! 馬名\` の行は馬名の食い違い（馬名は書き換えていない。data/README.md「馬名を直す」）"
              echo "- 頭数と馬番が出馬表と合っているか"
              echo "- 過去走で書き換えたファイルは投入で流し直され、そのレースで YAML に無い出走馬（画面から入れた馬）の枠・馬番は消える（.claude/skills/race-data/SKILL.md「3. 過去5走を取る」）"
              echo "- 別のレースの PR が同じ過去のレースを書いていると、片方をマージしたあと他方が競合する。そのときは管理画面の「出走馬を取得」で取り直せば main から作り直される"
            fi
            echo
            echo "## なぜ"
            echo
            echo "$why"
            echo
            echo "## 画面"
            echo
            echo "データの登録のみ。取得のログ:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/fetch.log"
            echo '```'
            echo
            echo "\`data:check\`:"
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/check-with-past.log" ]; then
              echo "過去走を外す前の \`data:check\`（落ちた）:"
              echo
              grep -E "(^✗|^合計)" "$RUNNER_TEMP/check-with-past.log" | head -40 || true
              echo
              echo "外したあと:"
              echo
            fi
            names=$(printf '%s\n' "${files[@]}" | xargs -n1 basename | paste -sd'|')
            grep -E "(^✗|${names}|^合計)" "$RUNNER_TEMP/check.log" || true
            echo '```'
            echo
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## 評価"
            echo
            echo "対象外（Actions が作ったデータの登録のみ。UI も振る舞いも変わらない）"
            echo
            echo "## コードレビュー"
            echo
            echo "reviewer-yaml: 未実施（Actions が作った PR にはエージェントのレビューが走らない。上の「レビューで見てほしいところ」を人が見る。docs/review.md 第6章）"
          } > "$RUNNER_TEMP/pr-body.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --quiet -c "$branch"
          git commit --quiet -m "data: ${subject}を netkeiba から取る" -m "起動元: ${TRIGGER}${STAGE:+（段: ${STAGE}）}"
          # Actions だけが書くブランチなので、作り直して上書きする。
          git push --quiet --force origin "$branch"

          if [ -n "$url" ]; then
            gh pr edit "$url" --body-file "$RUNNER_TEMP/pr-body.txt"
          else
            url=$(gh pr create --base main --head "$branch" \
              --title "data: ${subject}を取る" \
              --body-file "$RUNNER_TEMP/pr-body.txt")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url"

  # PR ができたら知らせる（マージしないと本番に入らないため）。同じ中身で何もしなかった回は送らない。
  notify-pr:
    name: PR を通知
    needs: [fetch]
    if: needs.fetch.outputs.pr_url != '' && needs.fetch.result == 'success'
    uses: ./.github/workflows/discord-notify.yml
    with:
      channel: deploy
      level: success
      title: ${{ inputs.command == 'result' && '結果' || '出走馬' }}の PR ができた（${{ inputs.date }} ${{ inputs.course }}${{ inputs.race_number }}R）
      description: ${{ needs.fetch.outputs.pr_url }} をマージすると本番に入ります。
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}

  # 金曜の回で枠順が未確定だった。1日1回しか取らないので、知らせないと誰も気づかない。
  notify-unconfirmed:
    name: 枠順の未確定を通知
    needs: [fetch]
    if: needs.fetch.outputs.unconfirmed == 'true' && needs.fetch.result == 'success'
    uses: ./.github/workflows/discord-notify.yml
    with:
      channel: deploy
      level: warn
      title: 枠順がまだ出ていない（${{ inputs.date }} ${{ inputs.course }}${{ inputs.race_number }}R）
      description: 金曜の Cron の回で枠順が未確定だった。発表を待って管理画面の「出走馬を取得」で取り直してください。
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}

  # 過去走だけが落ちた。出馬表の PR は作られている。
  notify-past-failed:
    name: 過去走の失敗を通知
    needs: [fetch]
    if: needs.fetch.outputs.past_failed == 'true' && needs.fetch.result == 'success'
    uses: ./.github/workflows/discord-notify.yml
    with:
      channel: deploy
      level: warn
      title: 過去走の取得が落ちた（${{ inputs.date }} ${{ inputs.course }}${{ inputs.race_number }}R）
      description: 過去走は取れなかったか、data:check に落ちて外しました（理由は PR 本文と run のログ）。出馬表は取れています（PR ができていればそちらに入っています。PR を作り直した回は、前の回に入っていた過去走もその PR から抜けています）。過去走は手で pnpm run data:fetch past を流すか、管理画面の「出走馬を取得」で取り直してください。
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}

  notify-failure:
    name: 失敗を通知
    needs: [fetch]
    if: failure()
    uses: ./.github/workflows/discord-notify.yml
    with:
      channel: deploy
      level: error
      title: ${{ inputs.command == 'result' && '結果' || '出走馬' }}の取得が落ちた（${{ inputs.date }} ${{ inputs.course }}${{ inputs.race_number }}R）
      description: netkeiba からの取得か、data:check か、PR の作成で止まっています。${{ inputs.command == 'result' && '結果が未確定だった・出走馬や枠順の PR が開いていたなら、確定やマージを待って Actions を command result で手で起動し、取り直してください。' || '' }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
