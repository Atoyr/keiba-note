name: 出走馬・結果の取得

# Worker から workflow_dispatch で起動される（src/lib/server/race-data/）。
#   cron  … 重賞の出馬表が決まる時刻に、段（stage）ごとに。日曜の候補・木曜の出走馬は出馬表をそのまま書く。
#           金曜の枠順（stage: frames）は require_confirmed: true で、確定するまでは何も書かない
#   admin … 管理画面の「出走馬を取得」（候補でも枠順でも、その時点の出馬表を書く）
#   manual … Actions のタブから手で。command で何を取るかを選ぶ（entries = 出馬表 / result = 結果）。
#           結果（command: result）は Cron・管理画面からは頼まない。この manual だけ
#
# netkeiba の出馬表を `data:fetch entries`、結果を `data:fetch result` で data/races/<開催日>.yaml に書き、差分があれば PR を作る。
# PR のブランチは command ごとに分ける（出馬表の PR がまだ開いていても、結果の取得が上書きしない）。
# **D1 には触らない。** 本番に入るのは、人がその PR をマージしたとき（data-import.yml）。
# 出走馬データの正は YAML のまま（docs/architecture.md 第0章）。
#
# 動かすには、リポジトリの Settings > Actions > General で
# 「Allow GitHub Actions to create and approve pull requests」を入れておく（docs/operations.md）。
# GITHUB_TOKEN で作った PR には ci.yml・pr-body.yml が走らない。検証（data:check）はここで済ませる。
on:
  workflow_dispatch:
    inputs:
      command:
        description: '何を取るか（entries = 候補・出走馬・枠順 / result = 結果）。Worker（Cron・管理画面）は送らないので entries'
        type: choice
        options:
          - entries
          - result
        required: false
        default: entries
      date:
        description: '開催日（YYYY-MM-DD）'
        type: string
        required: true
      course:
        description: '競馬場（中山 など JRA の10場）'
        type: string
        required: true
      race_number:
        description: 'レース番号（1〜12）'
        type: string
        required: true
      race_id:
        description: 'netkeiba の race_id（12桁）。分かっていれば。無ければ当週のレース一覧から引く'
        type: string
        required: false
        default: ''
      require_confirmed:
        description: '枠順が確定していなければ何も書かない'
        type: boolean
        required: false
        default: false
      stage:
        description: 'Cron の段（candidates / entries / frames）。PR 本文の「なぜ」に使う。Cron 以外は空'
        type: string
        required: false
        default: ''
      trigger:
        description: '起動元（cron / admin / manual）。PR 本文に書く'
        type: string
        required: false
        default: manual

permissions:
  contents: write
  pull-requests: write

# 同じレースの取得だけを1本ずつにする。全体を1つの群にすると、待っている回は最新の1つしか残らず、
# 同じ回に頼まれた別のレースが取り消される。
concurrency:
  group: race-data-fetch-${{ inputs.command }}-${{ inputs.date }}-${{ inputs.course }}-${{ inputs.race_number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  fetch:
    name: 取得
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pr_url: ${{ steps.pr.outputs.url }}
      unconfirmed: ${{ steps.fetch.outputs.unconfirmed }}
    # 入力は環境変数で渡す。run の中に ${{ }} で埋め込むと、値がシェルとして解釈されうる。
    env:
      COMMAND: ${{ inputs.command }}
      DATE: ${{ inputs.date }}
      COURSE: ${{ inputs.course }}
      RACE_NUMBER: ${{ inputs.race_number }}
      RACE_ID: ${{ inputs.race_id }}
      REQUIRE_CONFIRMED: ${{ inputs.require_confirmed }}
      STAGE: ${{ inputs.stage }}
      TRIGGER: ${{ inputs.trigger }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 入力を確かめる
        run: |
          # choice でも API からは任意の文字列が来うる。Worker は command を送らないので、空は entries の扱い
          COMMAND="${COMMAND:-entries}"
          [[ "$COMMAND" =~ ^(entries|result)$ ]] || { echo "::error::command が entries / result のどちらでもありません"; exit 1; }
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::date が YYYY-MM-DD ではありません"; exit 1; }
          [[ "$RACE_NUMBER" =~ ^([1-9]|1[0-2])$ ]] || { echo "::error::race_number が 1〜12 ではありません"; exit 1; }
          [[ -z "$RACE_ID" || "$RACE_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::race_id が12桁の数字ではありません"; exit 1; }
          [[ -z "$STAGE" || "$STAGE" =~ ^(candidates|entries|frames)$ ]] || { echo "::error::stage が candidates / entries / frames のどれでもありません"; exit 1; }
          if [ "$COMMAND" = "result" ]; then
            # 結果に、枠順の確定待ちや Cron の段は無い
            [ "$REQUIRE_CONFIRMED" != "true" ] || { echo "::error::command が result のとき require_confirmed は使えません"; exit 1; }
            [ -z "$STAGE" ] || { echo "::error::command が result のとき stage は使えません"; exit 1; }
          fi
          # course が JRA の10場かは data:fetch が見る

      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 騎手・調教師の名前（data:fetch が各人のページを引いて node_modules/.cache/race-data/ に覚える）を
      # 回をまたいで使う。無いと毎回30頭ぶん以上 netkeiba を引きに行く。
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/race-data
          key: race-data-people-${{ github.run_id }}
          restore-keys: race-data-people-

      - name: netkeiba から取る
        id: fetch
        run: |
          COMMAND="${COMMAND:-entries}"
          args=("$COMMAND" "$DATE" "$COURSE" "$RACE_NUMBER")
          if [ -n "$RACE_ID" ]; then args+=(--race-id "$RACE_ID"); fi
          if [ "$COMMAND" = "entries" ] && [ "$REQUIRE_CONFIRMED" = "true" ]; then args+=(--require-confirmed); fi
          pnpm run --silent data:fetch "${args[@]}" | tee "$RUNNER_TEMP/fetch.log"
          # 金曜の回は1日1回しか取らない。枠順が未確定で終わったら、黙らずに知らせる（notify-unconfirmed）
          if [ "$STAGE" = "frames" ] && grep -q "枠順未確定のため書きません" "$RUNNER_TEMP/fetch.log"; then
            echo "unconfirmed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 差分を見る
        id: diff
        run: |
          if git diff --quiet -- data/races; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "main と同じ中身なので PR は作らない"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: 出走馬データの検証
        if: steps.diff.outputs.changed == 'true'
        run: pnpm run --silent data:check | tee "$RUNNER_TEMP/check.log"

      - name: PR を作る・更新する
        id: pr
        if: steps.diff.outputs.changed == 'true'
        run: |
          COMMAND="${COMMAND:-entries}"
          # 出馬表と結果は別のブランチ・別の PR にする
          if [ "$COMMAND" = "result" ]; then
            branch="data-fetch/${DATE}-${COURSE}${RACE_NUMBER}R-result"
            subject="${DATE} ${COURSE}${RACE_NUMBER}R の結果"
          else
            branch="data-fetch/${DATE}-${COURSE}${RACE_NUMBER}R"
            subject="${DATE} ${COURSE}${RACE_NUMBER}R の出走馬"
          fi
          file="data/races/${DATE}.yaml"

          # 同じレースは段ごとに何度も取る（候補・出走馬・枠順）。開いている PR が同じ中身なら何もしない
          # （url を出さないので、通知も送らない）。ブランチだけを見ると、PR の作成で落ちた回に
          # push したブランチが残り、そのあとは PR が無いまま何もしなくなる。
          # --head はブランチ名だけで照らすので、同じ名前の fork からの PR も当たる。このリポジトリの PR だけを見る。
          url=$(gh pr list --head "$branch" --state open --json url,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].url // ""')
          if [ -n "$url" ] && git fetch --quiet origin "$branch" 2>/dev/null && git diff --quiet FETCH_HEAD -- "$file"; then
            echo "開いている PR（$url）と同じ中身なので何もしない"
            exit 0
          fi

          if [ "$COMMAND" = "result" ]; then
            why="${TRIGGER} から結果の取得を頼まれたため。"
          elif [ "$TRIGGER" = "cron" ]; then
            case "$STAGE" in
              candidates) why="日曜の候補の決定に合わせて Cron が出馬表（登録馬）を取ったため。" ;;
              entries) why="木曜の出走馬の発表に合わせて Cron が出馬表を取ったため（枠順が出ていれば枠・馬番まで入る）。" ;;
              frames) why="金曜の枠順の発表に合わせて Cron が出馬表を取り、枠順が確定していたため。" ;;
              *) why="Cron が重賞の出馬表を取ったため。" ;;
            esac
          else
            why="${TRIGGER} から取得を頼まれたため。"
          fi

          if [ "$COMMAND" = "result" ]; then
            what="netkeiba の結果を \`data:fetch result\` で書いた"
          else
            what="netkeiba の出馬表を \`data:fetch entries\` で書いた"
          fi

          {
            echo "## 何を変えたか"
            echo
            echo "- \`${file}\` の ${COURSE}${RACE_NUMBER}R に、${what}（起動元: ${TRIGGER}）"
            echo "- このブランチは Actions が作り直す。同じレースをもう一度取ると、main から作り直して上書きする（手で足したコミットは消える）"
            echo
            echo "**⚠️ マージすると \`data-import.yml\` が本番 D1 に投入する。**"
            echo
            echo "## レビューで見てほしいところ"
            echo
            if [ "$COMMAND" = "result" ]; then
              echo "- 着順が数字で入った頭数が出走頭数（\`fieldSize\`）と合っているか。取消・除外・中止はログに \`取消\` などと出て着順は入らない"
              echo "- 結果は上書きなので、以前に手で入れた値と netkeiba が食い違うとその行が差分に出る（正しい方は db.netkeiba.com のレースページで確かめる）"
              echo "- YAML にいない馬は足さない（ログに並ぶ）"
              echo "- \`! 馬名\` の行は馬名の食い違い（馬名は書き換えていない。data/README.md「馬名を直す」）"
            else
              echo "- 下のログの \`- …（出馬表に無いので withdrawn へ）\` は取り下げた馬。投入すると出走馬行が消え、付いていたメモは近況メモへ移る"
              echo "- \`! 馬名\` の行は馬名の食い違い（馬名は書き換えていない。data/README.md「馬名を直す」）"
              echo "- 頭数と馬番が出馬表と合っているか"
            fi
            echo
            echo "## なぜ"
            echo
            echo "$why"
            echo
            echo "## 画面"
            echo
            echo "データの登録のみ。取得のログ:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/fetch.log"
            echo '```'
            echo
            echo "\`data:check\`:"
            echo
            echo '```'
            grep -E "(^✗|${DATE}\.yaml|^合計)" "$RUNNER_TEMP/check.log" || true
            echo '```'
            echo
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## 評価"
            echo
            echo "対象外（Actions が作ったデータの登録のみ。UI も振る舞いも変わらない）"
            echo
            echo "## コードレビュー"
            echo
            echo "reviewer-yaml: 未実施（Actions が作った PR にはエージェントのレビューが走らない。上の「レビューで見てほしいところ」を人が見る。docs/review.md 第6章）"
          } > "$RUNNER_TEMP/pr-body.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --quiet -c "$branch"
          git add -- "$file"
          git commit --quiet -m "data: ${subject}を netkeiba から取る" -m "起動元: ${TRIGGER}${STAGE:+（段: ${STAGE}）}"
          # Actions だけが書くブランチなので、作り直して上書きする。
          git push --quiet --force origin "$branch"

          if [ -n "$url" ]; then
            gh pr edit "$url" --body-file "$RUNNER_TEMP/pr-body.txt"
          else
            url=$(gh pr create --base main --head "$branch" \
              --title "data: ${subject}を取る" \
              --body-file "$RUNNER_TEMP/pr-body.txt")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url"

  # PR ができたら知らせる（マージしないと本番に入らないため）。同じ中身で何もしなかった回は送らない。
  notify-pr:
    name: PR を通知
    needs: [fetch]
    if: needs.fetch.outputs.pr_url != '' && needs.fetch.result == 'success'
    uses: ./.github/workflows/discord-notify.yml
    with:
      channel: deploy
      level: success
      title: ${{ inputs.command == 'result' && '結果' || '出走馬' }}の PR ができた（${{ inputs.date }} ${{ inputs.course }}${{ inputs.race_number }}R）
      description: ${{ needs.fetch.outputs.pr_url }} をマージすると本番に入ります。
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}

  # 金曜の回で枠順が未確定だった。1日1回しか取らないので、知らせないと誰も気づかない。
  notify-unconfirmed:
    name: 枠順の未確定を通知
    needs: [fetch]
    if: needs.fetch.outputs.unconfirmed == 'true' && needs.fetch.result == 'success'
    uses: ./.github/workflows/discord-notify.yml
    with:
      channel: deploy
      level: warn
      title: 枠順がまだ出ていない（${{ inputs.date }} ${{ inputs.course }}${{ inputs.race_number }}R）
      description: 金曜の Cron の回で枠順が未確定だった。発表を待って管理画面の「出走馬を取得」で取り直してください。
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}

  notify-failure:
    name: 失敗を通知
    needs: [fetch]
    if: failure()
    uses: ./.github/workflows/discord-notify.yml
    with:
      channel: deploy
      level: error
      title: ${{ inputs.command == 'result' && '結果' || '出走馬' }}の取得が落ちた（${{ inputs.date }} ${{ inputs.course }}${{ inputs.race_number }}R）
      description: netkeiba からの取得か、data:check か、PR の作成で止まっています。
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
